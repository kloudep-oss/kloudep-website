
name: KLOUDEP Supabase Daily Health

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify Supabase health_check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_KEY"]

          url = (
              f"{base}/rest/v1/health_check"
              "?select=id,status&id=eq.1"
          )

          request = urllib.request.Request(
              url,
              headers={"apikey": key}
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=20
              ) as response:
                  status = response.status
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              raise RuntimeError(
                  f"Supabase HTTP error: {error.code}"
              ) from error

          if status != 200:
              raise RuntimeError(
                  f"Unexpected HTTP status: {status}"
              )

          if not (
              isinstance(data, list)
              and len(data) == 1
              and data[0].get("id") == 1
              and data[0].get("status") == "ok"
          ):
              raise RuntimeError(
                  "Unexpected health_check response"
              )

          print("KLOUDEP Supabase: HEALTHY")
          PY
